<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration | MMIT Freshers Party 2026</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #f8fafc
                );

            min-height: 100vh;

            padding: 30px 15px;

        }


        .container {

            max-width: 650px;

            margin: auto;

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.12);

        }


        .college-image {

            display: block;

            width: 150px;

            height: 90px;

            object-fit: cover;

            border-radius: 12px;

            margin: 0 auto 15px auto;

        }


        h1 {

            text-align: center;

            color: #172554;

            font-size: 30px;

            margin-bottom: 5px;

        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            color: #333;

            margin-bottom: 8px;

        }


        input,
        select {

            width: 100%;

            padding: 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;

        }


        input:focus,
        select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.10);

        }


        .row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

        }


        .fee-box {

            background: #eff6ff;

            border-radius: 12px;

            padding: 18px;

            margin: 25px 0;

            text-align: center;

        }


        .fee-box p {

            color: #555;

        }


        .fee {

            font-size: 30px;

            font-weight: bold;

            color: #2563eb;

        }


        .teacher-note {

            display: none;

            background: #fff7ed;

            border-left: 5px solid #f97316;

            padding: 12px;

            border-radius: 8px;

            color: #555;

            margin-top: 10px;

        }


        button {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 30px;

            background: #2563eb;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }


        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

        }


        /* EMAIL ERROR */

        .input-error {

            border:
                2px solid red !important;

            box-shadow:
                0 0 0 3px
                rgba(255,0,0,0.08) !important;

        }


        @media (max-width: 600px) {

            .container {

                padding: 25px 20px;

            }

            .row {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- COLLEGE IMAGE -->

    <img
        src="{{ url_for('static', filename='images/college.jpg') }}"
        class="college-image"
        alt="MMIT Kushinagar"
    >


    <!-- TITLE -->

    <h1>

        🎉 Freshers Party 2026

    </h1>


    <p class="subtitle">

        MMIT KUSHINAGAR — Registration

    </p>


    <!-- REGISTRATION FORM -->

    <form
        action="/register"
        method="POST"
        onsubmit="return validateRegistrationForm()"
    >


        <!-- NAME -->

        <div class="form-group">

            <label>

                Full Name *

            </label>

            <input
                type="text"
                name="name"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- PARTICIPANT TYPE -->

        <div class="form-group">

            <label>

                Registration Type *

            </label>

            <select
                name="participant_type"
                id="participantType"
                required
                onchange="changeType()"
            >

                <option value="">

                    Select Type

                </option>

                <option value="Student">

                    Student

                </option>

                <option value="Teacher">

                    Teacher

                </option>

            </select>

        </div>


        <!-- STUDENT FIELDS -->

        <div id="studentFields">


            <!-- YEAR -->

            <div class="form-group">

                <label>

                    Year *

                </label>

                <select
                    name="year"
                    id="year"
                    onchange="updateFee()"
                >

                    <option value="">

                        Select Year

                    </option>

                    <option value="1st Year">

                        1st Year

                    </option>

                    <option value="2nd Year">

                        2nd Year

                    </option>

                    <option value="3rd Year">

                        3rd Year

                    </option>

                </select>

            </div>


            <!-- BRANCH -->

            <div class="form-group">

                <label>

                    Branch *

                </label>

                <select
                    name="branch"
                    id="branch"
                >

                    <option value="">

                        Select Branch

                    </option>

                    <option value="Computer Science">

                        Computer Science

                    </option>

                    <option value="Information Technology">

                        Information Technology

                    </option>

                    <option value="Electrical Engineering">

                        Electrical Engineering

                    </option>

                    <option value="Mechanical Engineering">

                        Mechanical Engineering

                    </option>

                    <option value="Civil Engineering">

                        Civil Engineering

                    </option>

                </select>

            </div>


        </div>


        <!-- TEACHER AMOUNT -->

        <div
            class="form-group"
            id="teacherAmountBox"
            style="display:none;"
        >

            <label>

                Teacher Payment Amount (₹) *

            </label>

            <input
                type="number"
                name="teacher_amount"
                id="teacherAmount"
                min="1"
                step="1"
                placeholder="Enter amount"
                oninput="updateTeacherFee()"
            >

            <div
                class="teacher-note"
                id="teacherNote"
            >

                Teacher के लिए amount fixed नहीं है।
                कृपया अपना payment amount enter करें।

            </div>

        </div>


        <!-- MOBILE -->

        <div class="form-group">

            <label>

                Mobile Number *

            </label>

            <input
                type="tel"
                name="mobile"
                id="mobile"
                placeholder="Enter 10 digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                inputmode="numeric"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>

                Email Address *

            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

        </div>


        <!-- GENDER -->

        <div class="form-group">

            <label>

                Gender *

            </label>

            <select
                name="gender"
                id="gender"
                required
            >

                <option value="">

                    Select Gender

                </option>

                <option value="Male">

                    Male

                </option>

                <option value="Female">

                    Female

                </option>

                <option value="Other">

                    Other

                </option>

            </select>

        </div>


        <!-- FEE -->

        <div class="fee-box">

            <p>

                Freshers Party Registration Fee

            </p>

            <div
                class="fee"
                id="fee"
            >

                Select Type

            </div>

        </div>


        <!-- SUBMIT -->

        <button type="submit">

            Continue to Registration

        </button>


    </form>


    <!-- BACK -->

    <a
        href="/"
        class="back"
    >

        ← Back to Home

    </a>


</div>



<script>


/* ==================================================
   PARTICIPANT TYPE CHANGE
   ================================================== */

function changeType() {

    const type =
        document.getElementById(
            "participantType"
        ).value;


    const studentFields =
        document.getElementById(
            "studentFields"
        );


    const teacherBox =
        document.getElementById(
            "teacherAmountBox"
        );


    const year =
        document.getElementById(
            "year"
        );


    const branch =
        document.getElementById(
            "branch"
        );


    const teacherAmount =
        document.getElementById(
            "teacherAmount"
        );


    const fee =
        document.getElementById(
            "fee"
        );


    const teacherNote =
        document.getElementById(
            "teacherNote"
        );


    /* ==================================================
       STUDENT
       ================================================== */

    if (type === "Student") {

        studentFields.style.display =
            "block";

        teacherBox.style.display =
            "none";


        year.required =
            true;

        branch.required =
            true;

        teacherAmount.required =
            false;


        teacherNote.style.display =
            "none";


        updateFee();

    }


    /* ==================================================
       TEACHER
       ================================================== */

    else if (type === "Teacher") {

        studentFields.style.display =
            "none";

        teacherBox.style.display =
            "block";


        year.required =
            false;

        branch.required =
            false;

        teacherAmount.required =
            true;


        teacherNote.style.display =
            "block";


        fee.innerText =
            "Enter Amount";

    }


    /* ==================================================
       NOTHING SELECTED
       ================================================== */

    else {

        studentFields.style.display =
            "block";

        teacherBox.style.display =
            "none";


        year.required =
            false;

        branch.required =
            false;

        teacherAmount.required =
            false;


        fee.innerText =
            "Select Type";

    }

}



/* ==================================================
   STUDENT FEE
   ================================================== */

function updateFee() {

    const type =
        document.getElementById(
            "participantType"
        ).value;


    const year =
        document.getElementById(
            "year"
        ).value;


    const fee =
        document.getElementById(
            "fee"
        );


    if (type !== "Student") {

        return;

    }


    if (year === "1st Year") {

        fee.innerText =
            "₹199";

    }


    else if (
        year === "2nd Year"
        ||
        year === "3rd Year"
    ) {

        fee.innerText =
            "₹300";

    }


    else {

        fee.innerText =
            "Select Year";

    }

}



/* ==================================================
   TEACHER FEE
   ================================================== */

function updateTeacherFee() {

    const amount =
        document.getElementById(
            "teacherAmount"
        ).value;


    const fee =
        document.getElementById(
            "fee"
        );


    if (amount) {

        fee.innerText =
            "₹" + amount;

    }


    else {

        fee.innerText =
            "Enter Amount";

    }

}



/* ==================================================
   EMAIL VALIDATION
   ================================================== */

function validateEmail() {

    const email =
        document.getElementById(
            "email"
        );


    const value =
        email.value.trim();


    /*
       Empty email
    */

    if (value === "") {

        email.classList.add(
            "input-error"
        );

        email.focus();

        return false;

    }


    /*
       Email format
    */

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (!emailPattern.test(value)) {

        email.classList.add(
            "input-error"
        );

        email.focus();

        return false;

    }


    /*
       Valid email
    */

    email.classList.remove(
        "input-error"
    );


    return true;

}



/* ==================================================
   EMAIL LIVE VALIDATION
   ================================================== */

document
    .getElementById("email")
    .addEventListener(
        "input",
        function () {

            const value =
                this.value.trim();


            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (
                value !== ""
                &&
                emailPattern.test(value)
            ) {

                this.classList.remove(
                    "input-error"
                );

            }

        }
    );



/* ==================================================
   COMPLETE FORM VALIDATION
   ================================================== */

function validateRegistrationForm() {


    /* ------------------------------------------
       EMAIL
       ------------------------------------------ */

    if (!validateEmail()) {

        return false;

    }


    /* ------------------------------------------
       PARTICIPANT TYPE
       ------------------------------------------ */

    const type =
        document.getElementById(
            "participantType"
        ).value;


    if (!type) {

        document
            .getElementById(
                "participantType"
            )
            .focus();

        return false;

    }


    /* ------------------------------------------
       STUDENT VALIDATION
       ------------------------------------------ */

    if (type === "Student") {

        const year =
            document.getElementById(
                "year"
            ).value;


        const branch =
            document.getElementById(
                "branch"
            ).value;


        if (!year) {

            document
                .getElementById(
                    "year"
                )
                .focus();

            return false;

        }


        if (!branch) {

            document
                .getElementById(
                    "branch"
                )
                .focus();

            return false;

        }

    }


    /* ------------------------------------------
       TEACHER VALIDATION
       ------------------------------------------ */

    if (type === "Teacher") {

        const teacherAmount =
            document.getElementById(
                "teacherAmount"
            ).value;


        if (
            !teacherAmount
            ||
            Number(teacherAmount) <= 0
        ) {

            document
                .getElementById(
                    "teacherAmount"
                )
                .focus();

            return false;

        }

    }


    return true;

}


</script>


</body>

</html>
